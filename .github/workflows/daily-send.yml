name: Send Daily Video History

on:
  schedule:
    # Friday at 20:00 UTC
    - cron: '0 20 * * FRI'
    # Monday at 08:00 UTC
    - cron: '0 8 * * MON'
  workflow_dispatch:

jobs:
  send-emails:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Deno
      uses: denolib/setup-deno@v2
      with:
        deno-version: '1.x'

    - name: Run sendDailyEmails script
      env:
        SUPABASE_URL:                    ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY:       ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        RESEND_API_KEY:                  ${{ secrets.RESEND_API_KEY }}
      run: deno run --allow-net --allow-env --allow-read scripts/sendDailyEmails.ts
